[project]
name = "comidas-panel"
version = "0.1.0"
description = "Panel de cocina (hoy, descongelar, posponer, valorar, compra) sobre Mealie y Home Assistant"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["panel"]

[tool.setuptools.package-data]
panel = ["static/*", "static/fonts/*"]
